# Inside the existing STOQ HTTPS server block. Gateway stays on localhost:3000.
location = /swagger { return 308 /swagger/; }
location /swagger/ {
    proxy_pass http://127.0.0.1:3000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding "";
    # Public business routes are under /api; Swagger UI is mounted separately.
    sub_filter_types application/javascript;
    sub_filter '"servers": []' '"servers": [{"url":"/api"}]';
    sub_filter_once on;
}
